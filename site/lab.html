(function () {

<script type="module">
import { init as initFormulas, formatBind } from './js/stage/formulas.js';
import { mount } from './js/stage/labpanel.js';

const html = document.documentElement;
const q = new URLSearchParams(location.search);
const setLang = (l) => {
  html.dataset.lang = l; html.lang = l === 'zh' ? 'zh-Hant' : 'en';
  for (const b of document.querySelectorAll('[data-lang-btn]')) b.setAttribute('aria-pressed', String(b.dataset.langBtn === l));
  try { localStorage.setItem('vlm.lang', l); } catch { /* private mode */ }
};
let saved = null; try { saved = localStorage.getItem('vlm.lang'); } catch { /* private mode */ }
setLang(['en', 'zh'].includes(q.get('lang')) ? q.get('lang') : saved === 'zh' || (saved == null && html.dataset.lang === 'zh') ? 'zh' : 'en');
const themeBtn = document.getElementById('lab-theme');
const paintTheme = () => themeBtn.setAttribute('aria-pressed', String(html.dataset.theme === 'dark'));
themeBtn.addEventListener('click', () => { html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark'; paintTheme(); });
paintTheme();
for (const b of document.querySelectorAll('[data-lang-btn]')) b.addEventListener('click', () => setLang(b.dataset.langBtn));

const listeners = new Map();
const bus = {
  on(type, fn) { if (!listeners.has(type)) listeners.set(type, new Set()); listeners.get(type).add(fn); return () => listeners.get(type).delete(fn); },
  emit(type, data) { for (const fn of listeners.get(type) || []) { try { fn(data); } catch (e) { console.error(e); } } },
};
const ctx = {
  bus,
  bind(key, value) { for (const o of document.querySelectorAll(`output[data-bind="${CSS.escape(key)}"]`)) o.textContent = formatBind(value, { unit: o.dataset.unit || '', digits: o.dataset.digits != null ? +o.dataset.digits : undefined, key }); },
  lang: () => html.dataset.lang,
  katex: null,
  setStatus(text) { document.querySelector('.stage-status').textContent = text; },
};
await new Promise((r) => (window.katex ? r() : addEventListener('DOMContentLoaded', r, { once: true })));
ctx.katex = window.katex;

// keep a handle for tools (tools/snap.py, tools/record_lab.py); not used by the page itself
const { createLab } = await import('./js/lab/index.js').catch(() => ({}));
if (createLab) ctx.createLab = async (...a) => { const lab = await createLab(...a); window.__lab = lab; return lab; };
initFormulas(ctx);
const panel = await mount(document.getElementById('pane-lab'), ctx);
window.__panel = panel;
panel.onShow?.();
if (q.get('tab')) panel.showTab?.(q.get('tab'));
if (q.get('act')) panel.act(...q.get('act').split(':').reduce((acc, s, i) => (i === 0 ? [s, []] : [acc[0], [...acc[1], s]]), []));
</script>
